<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AgentTrust Web</title><style>body{font:17px system-ui;background:#101827;color:#e6edf7;max-width:850px;margin:50px auto;padding:20px}h1{font-size:48px}section{background:#1e293b;padding:24px;border-radius:16px;margin:20px 0}button,select{font:inherit;padding:12px;margin:8px;border-radius:8px}button{background:#a7f3d0;color:#10251d;border:0}pre{white-space:pre-wrap}small{color:#b5c5d9}</style><h1>AgentTrust Web</h1><p>Zero-trust policy playground for agent collaboration</p><small>Prototype · Synthetic travel requests · No external AI model or network calls</small><section><h2>Evaluate an agent request</h2><label>Scenario <select id="scenario"><option value="normal">Hotel search</option><option value="privacy">Private data request</option><option value="purchase">Unauthorized purchase</option><option value="loop">Recursive execution</option></select></label><label><input id="consent" type="checkbox"> Approve hotel search</label><button id="run">Evaluate policy</button></section><section aria-live="polite"><h2 id="decision">Awaiting request</h2><pre id="trace"></pre></section><script type="module">import {authorize} from './runtime.mjs';document.querySelector('#run').onclick=()=>{const s=document.querySelector('#scenario').value;const r={depth:s==='loop'?4:0,privateData:s==='privacy',capability:s==='purchase'?'purchase':'searchHotels',consent:document.querySelector('#consent').checked};const d=authorize(r);document.querySelector('#decision').textContent=(d.allow?'ALLOWED: ':'BLOCKED: ')+d.reason;document.querySelector('#trace').textContent=JSON.stringify({request:r,decision:d},null,2)};</script></html>
